<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — NEX</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8; --ink: #1A1A18; --sage: #6B8C6E;
    --terracotta: #C4704F; --warm-white: #FDFAF5; --muted: #7A7870;
    --border: rgba(26,26,24,0.12); --sage-light: #f0f5f1;
    --banner-color: #CFE8D3;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--warm-white); color: var(--ink); overflow-x: hidden; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    background: rgba(253,250,245,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
  .nav-links a { font-size: 0.875rem; font-weight: 400; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { background: var(--ink); color: var(--warm-white) !important; padding: 0.5rem 1.25rem; border-radius: 100px; font-weight: 500 !important; text-transform: none !important; }

  footer { background: var(--ink); padding: 2.5rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  footer .logo { color: white; font-size: 1.2rem; }
  .footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }

  .page-wrap {
    padding: 8.5rem 3rem 5rem; min-height: 100vh;
    display: flex; justify-content: center;
  }

  .profile-page { width: 100%; max-width: 1080px; }

  .loading-text { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 6rem 2rem; }

  /* ---- Banner ---- */
  .profile-banner {
    position: relative; height: 170px; border-radius: 20px;
    background: var(--banner-color); transition: background 0.25s ease;
  }
  .banner-color-btn {
    position: absolute; top: 1rem; right: 1rem;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(253,250,245,0.9); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .color-picker {
    position: absolute; top: 3.6rem; right: 1rem;
    background: white; border-radius: 14px; padding: 0.7rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: none; grid-template-columns: repeat(4, 1fr); gap: 0.55rem;
    z-index: 20;
  }
  .color-picker.open { display: grid; }
  .color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .color-swatch.selected { border-color: var(--ink); }

  /* ---- Header: avatar + name/email ---- */
  .profile-header {
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    padding: 0 1rem; margin-top: 1.75rem; margin-bottom: 2.5rem;
    position: relative; z-index: 2;
  }
  .profile-avatar-btn {
    width: 112px; height: 112px; border-radius: 50%; flex-shrink: 0;
    border: 5px solid var(--warm-white); background: var(--sage);
    cursor: pointer; padding: 0; overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  .profile-avatar-btn img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .profile-idblock { min-width: 0; }
  .profile-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.7rem; line-height: 1.2; }
  .profile-email { font-size: 0.9rem; color: var(--muted); margin-top: 0.25rem; }
  .profile-eyebrow { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-left: auto; align-self: center; }

  /* ---- Section shell ---- */
  .section-block { margin-bottom: 2.25rem; }
  .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; padding: 0 0.25rem; }

  .profile-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 1.75rem; margin-bottom: 2.25rem; align-items: start; }
  @media (max-width: 760px) { .profile-grid { grid-template-columns: 1fr; } }

  .profile-box {
    background: white; border-radius: 16px; border: 1px solid var(--border); overflow: hidden;
  }
  .profile-row { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); }
  .profile-row:last-child { border-bottom: none; }
  .profile-row .label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
  .profile-row .value { font-size: 1rem; color: var(--ink); font-weight: 400; }

  /* ---- Scenario buttons ---- */
  .scenario-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  @media (max-width: 760px) { .scenario-grid { grid-template-columns: 1fr; } }
  .scenario-card {
    position: relative;
    background: white; border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem 1.25rem; font-size: 0.95rem; font-weight: 500; color: var(--ink);
    text-align: left; font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; gap: 0.5rem; cursor: default; min-height: 88px; justify-content: center;
  }
  .scenario-card .emoji { font-size: 1.4rem; }
  .scenario-remove {
    position: absolute; top: 0.6rem; right: 0.6rem;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--cream); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; cursor: pointer; border: none;
  }
  .scenario-remove:hover { background: var(--terracotta); color: white; }

  .scenario-add-card {
    background: none; border: 1.5px dashed var(--border); border-radius: 14px;
    min-height: 88px; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .scenario-add-card:hover { border-color: var(--ink); color: var(--ink); background: var(--cream); }

  .scenario-options-list {
    display: flex; flex-direction: column; gap: 0.5rem;
    max-height: 55vh; overflow-y: auto; margin-bottom: 1.25rem;
    text-align: left;
  }
  .scenario-option-row {
    display: flex; align-items: center; gap: 0.75rem;
    width: 100%; background: white; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 0.75rem 1rem; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--ink);
    transition: border-color 0.2s, background 0.2s;
  }
  .scenario-option-row:hover { border-color: var(--ink); }
  .scenario-option-row.selected { border-color: var(--sage); background: var(--sage-light); }
  .scenario-option-row .emoji { font-size: 1.1rem; flex-shrink: 0; }
  .scenario-option-label { flex: 1; }
  .scenario-option-row .check { color: var(--sage); font-weight: 700; flex-shrink: 0; }

  /* ---- Calendar ---- */
  .calendar-box { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.6rem; height: 100%; }
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
  .calendar-nav button { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--muted); padding: 0.25rem 0.7rem; border-radius: 6px; }
  .calendar-nav button:hover { background: var(--cream); }
  .calendar-month-label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.05rem; text-transform: capitalize; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; text-align: center; }
  .calendar-dow { font-size: 0.65rem; color: var(--muted); font-weight: 600; padding-bottom: 0.45rem; text-transform: uppercase; }
  .calendar-day { font-size: 0.85rem; padding: 0.55rem 0; border-radius: 8px; color: var(--ink); }
  .calendar-day.empty { visibility: hidden; }
  .calendar-day.today { background: var(--sage); color: white; font-weight: 600; }
  .calendar-empty-note { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); text-align: center; }

  .action-row { display: flex; justify-content: flex-end; gap: 1rem; flex-wrap: wrap; }
  .btn-secondary {
    background: none; color: var(--ink); border: 1.5px solid var(--border);
    border-radius: 100px; padding: 0.85rem 2.25rem;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: border-color 0.2s, background 0.2s;
    text-decoration: none;
  }
  .btn-secondary:hover { border-color: var(--ink); background: var(--cream); }

  .btn-primary-full {
    background: var(--ink); color: white; border: none;
    border-radius: 100px; padding: 0.85rem 2.25rem;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.2s;
    text-decoration: none;
  }
  .btn-primary-full:hover { background: #333; }

  /* ---- Avatar picker modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,26,24,0.45);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 1.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: white; border-radius: 20px; padding: 2rem; max-width: 380px; width: 100%; text-align: center; }
  .modal-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.2rem; margin-bottom: 1.4rem; }
  .avatar-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; margin-bottom: 1.5rem; }
  .avatar-option { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; overflow: hidden; padding: 0; background: var(--cream); }
  .avatar-option.selected { border-color: var(--sage); }
  .avatar-option img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .modal-close {
    background: none; color: var(--muted); border: none; font-size: 0.85rem;
    cursor: pointer; font-family: 'DM Sans', sans-serif; text-decoration: underline;
  }

</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">NEX</a>
  <ul class="nav-links">
    <li><a href="about.html">Nosotros</a></li>
    <li><a href="contact.html">Contacto</a></li>
    <li><a href="faq.html">Preguntas frecuentes</a></li>
    <li id="navAuthSlot"><a href="login.html" class="nav-cta">Iniciar sesión</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="profile-page" id="profilePage">
    <p class="loading-text" id="loadingText">Cargando tu perfil…</p>
  </div>
</div>

<!-- Avatar picker modal -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal-box">
    <p class="modal-title">Elige tu avatar</p>
    <div class="avatar-options" id="avatarOptions"></div>
    <button class="modal-close" id="avatarModalClose">Cancelar</button>
  </div>
</div>

<!-- Scenario picker modal -->
<div class="modal-overlay" id="scenarioModal">
  <div class="modal-box" style="max-width:440px">
    <p class="modal-title">Elige tus escenarios</p>
    <div class="scenario-options-list" id="scenarioOptionsList"></div>
    <button class="modal-close" id="scenarioModalClose">Cerrar</button>
  </div>
</div>

<footer>
  <a href="index.html" class="logo">NEX</a>
  <p class="footer-copy">&copy; 2025 NEX. Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>
<script>
  const supabaseClient = getSupabaseClient();
  const page = document.getElementById('profilePage');

  // ---- Banner colors ----
  const BANNER_COLORS = [
    { key: 'azul',     label: 'Azul claro',   value: '#BFE0F0' },
    { key: 'verde',    label: 'Verde claro',  value: '#CFE8D3' },
    { key: 'naranja',  label: 'Naranja',      value: '#F0AA68' },
    { key: 'rojo',     label: 'Rojo claro',   value: '#F3B3AE' },
    { key: 'rosa',     label: 'Rosa',         value: '#F3C2D9' },
    { key: 'morado',   label: 'Morado claro', value: '#D9C7EC' },
    { key: 'amarillo', label: 'Amarillo',     value: '#F5E29B' }
  ];

  // ---- Avatares (los 4 que pasó Adrian) ----
  // Los archivos van en una carpeta "avatars/" junto a este profile.html
  const AVATARS = [
    { id: 1, src: 'avatars/avatar-1.png' }, // detective con mini-él
    { id: 2, src: 'avatars/avatar-2.png' }, // maquillaje
    { id: 3, src: 'avatars/avatar-3.png' }, // manejando
    { id: 4, src: 'avatars/avatar-4.png' }  // comiendo
  ];

  // ---- Opciones de escenario (técnicas/tratamientos) ----
  const SCENARIO_OPTIONS = [
    { id: 'tcc', label: 'Terapia Cognitivo-Conductual (TCC)', emoji: '🧠' },
    { id: 'act', label: 'Terapia de Aceptación y Compromiso (ACT)', emoji: '🤝' },
    { id: 'tip', label: 'Terapia Interpersonal (TIP)', emoji: '💬' },
    { id: 'exposicion', label: 'Exposición Interoceptiva', emoji: '💓' },
    { id: 'mindfulness', label: 'Mindfulness y Meditación', emoji: '🧘' },
    { id: 'rebm', label: 'Reducción del Estrés Basada en Mindfulness (REBM)', emoji: '🌿' },
    { id: 'respiracion', label: 'Técnicas de Respiración y Relajación Muscular Progresiva', emoji: '🌬️' },
    { id: 'resiliencia', label: 'Entrenamiento en Resiliencia', emoji: '💪' },
    { id: 'asertividad', label: 'Entrenamiento en Asertividad', emoji: '🗣️' },
    { id: 'desconexion', label: 'Rituales de Desconexión', emoji: '🔌' },
    { id: 'aerobico', label: 'Ejercicio Aeróbico', emoji: '🏃' },
    { id: 'sueno', label: 'Higiene del Sueño', emoji: '😴' },
    { id: 'nutricion', label: 'Nutrición y Terapia de Luz', emoji: '☀️' }
  ];

  let currentUserId = null;
  let prefs = { bannerColor: BANNER_COLORS[1].value, avatarId: 1, scenarios: [] };
  let calDate = new Date();

  function prefsKey(uid) { return `nex_profile_prefs_${uid}`; }

  function loadPrefs(uid) {
    try {
      const raw = localStorage.getItem(prefsKey(uid));
      if (raw) prefs = { ...prefs, ...JSON.parse(raw) };
    } catch (e) { /* ignore */ }
  }

  function savePrefs(uid) {
    try { localStorage.setItem(prefsKey(uid), JSON.stringify(prefs)); } catch (e) {}
    // Best-effort sync a Supabase. Requiere agregar columnas banner_color (text),
    // avatar_id (int2) y scenarios (jsonb) a la tabla "profiles" — ver nota al final del chat.
    supabaseClient.from('profiles')
      .update({ banner_color: prefs.bannerColor, avatar_id: prefs.avatarId, scenarios: prefs.scenarios })
      .eq('id', uid)
      .then(() => {}, () => {});
  }

  function avatarSrc(id) {
    return (AVATARS.find(a => a.id === id) || AVATARS[0]).src;
  }

  async function loadProfile() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const user = session.user;
    currentUserId = user.id;

    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('name, phone, age, tipo_consulta, role, track')
      .eq('id', user.id)
      .single();

    loadPrefs(user.id);

    const name = (profile && profile.name) ? profile.name : (user.email || 'Usuario');
    const isTherapist = profile && profile.role === 'therapist';

    let rows = '';

    if (profile && profile.phone) {
      rows += `
      <div class="profile-row">
        <p class="label">Teléfono</p>
        <p class="value">${escapeHtml(profile.phone)}</p>
      </div>`;
    }

    if (profile && profile.age) {
      rows += `
      <div class="profile-row">
        <p class="label">Edad</p>
        <p class="value">${escapeHtml(String(profile.age))}</p>
      </div>`;
    }

    if (!isTherapist && profile && profile.track) {
      rows += `
      <div class="profile-row">
        <p class="label">Track asignado</p>
        <p class="value">Track ${escapeHtml(profile.track)}</p>
      </div>`;
    }

    if (!rows) {
      rows = `
      <div class="profile-row">
        <p class="label">Correo</p>
        <p class="value">${escapeHtml(user.email || '—')}</p>
      </div>`;
    }

    const assignButton = isTherapist
      ? `<a href="assign-track.html" class="btn-primary-full">Asignar tratamiento</a>`
      : '';

    const swatchesHtml = BANNER_COLORS.map(c => `
      <button class="color-swatch${c.value === prefs.bannerColor ? ' selected' : ''}"
              style="background:${c.value}" data-color="${c.value}" title="${c.label}"></button>
    `).join('');

    page.innerHTML = `
      <div class="profile-banner" id="profileBanner" style="background:${prefs.bannerColor}">
        <button class="banner-color-btn" id="bannerColorBtn" title="Cambiar color de banner">🎨</button>
        <div class="color-picker" id="colorPicker">${swatchesHtml}</div>
      </div>

      <div class="profile-header">
        <button class="profile-avatar-btn" id="avatarBtn" title="Cambiar avatar">
          <img src="${avatarSrc(prefs.avatarId)}" alt="Avatar de ${escapeHtml(name)}">
        </button>
        <div class="profile-idblock">
          <p class="profile-name">${escapeHtml(name)}</p>
          <p class="profile-email">${escapeHtml(user.email || '—')}</p>
        </div>
        <p class="profile-eyebrow">${isTherapist ? 'Cuenta de terapeuta' : 'Tu cuenta'}</p>
      </div>

      <div class="profile-grid">
        <div class="section-block" style="margin-bottom:0;">
          <p class="section-label">Tu información</p>
          <div class="profile-box">${rows}</div>
        </div>
        <div class="section-block" style="margin-bottom:0;">
          <p class="section-label">Tu calendario</p>
          <div class="calendar-box">
            <div class="calendar-nav">
              <button id="calPrev">‹</button>
              <p class="calendar-month-label" id="calLabel"></p>
              <button id="calNext">›</button>
            </div>
            <div class="calendar-grid" id="calGrid"></div>
            <p class="calendar-empty-note" id="calNote">Aún no tienes citas programadas.</p>
          </div>
        </div>
      </div>

      ${isTherapist ? '' : `
      <div class="section-block">
        <p class="section-label">Tus botones de escenario</p>
        <div class="scenario-grid" id="scenarioGrid"></div>
      </div>`}

      <div class="action-row">
        ${assignButton}
        <button class="btn-secondary" id="logoutBtn">Cerrar sesión</button>
      </div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    setupBannerPicker();
    setupAvatarModal();
    if (!isTherapist) setupScenarioPicker();
    renderCalendar();
    document.getElementById('calPrev').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('calNext').addEventListener('click', () => shiftMonth(1));
  }

  // ---- Banner color picker ----
  function setupBannerPicker() {
    const btn = document.getElementById('bannerColorBtn');
    const picker = document.getElementById('colorPicker');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      picker.classList.toggle('open');
    });
    picker.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        const color = sw.dataset.color;
        prefs.bannerColor = color;
        document.getElementById('profileBanner').style.background = color;
        picker.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        picker.classList.remove('open');
        savePrefs(currentUserId);
      });
    });
    document.addEventListener('click', () => picker.classList.remove('open'));
  }

  // ---- Avatar modal ----
  function setupAvatarModal() {
    const modal = document.getElementById('avatarModal');
    const optionsWrap = document.getElementById('avatarOptions');
    optionsWrap.innerHTML = AVATARS.map(a => `
      <button class="avatar-option${a.id === prefs.avatarId ? ' selected' : ''}" data-id="${a.id}">
        <img src="${a.src}" alt="Avatar ${a.id}">
      </button>
    `).join('');

    document.getElementById('avatarBtn').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('avatarModalClose').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    optionsWrap.querySelectorAll('.avatar-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const id = parseInt(opt.dataset.id, 10);
        prefs.avatarId = id;
        document.querySelector('#avatarBtn img').src = avatarSrc(id);
        optionsWrap.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        modal.classList.remove('open');
        savePrefs(currentUserId);
      });
    });
  }

  // ---- Escenarios: renderizado + selector ----
  function renderScenarios() {
    const grid = document.getElementById('scenarioGrid');
    if (!grid) return;

    const selected = prefs.scenarios || [];
    const cardsHtml = selected.map(id => {
      const opt = SCENARIO_OPTIONS.find(o => o.id === id);
      if (!opt) return '';
      return `
      <div class="scenario-card" data-id="${opt.id}">
        <button class="scenario-remove" title="Quitar" data-id="${opt.id}">✕</button>
        <span class="emoji">${opt.emoji}</span>${escapeHtml(opt.label)}
      </div>`;
    }).join('');

    grid.innerHTML = `
      <button class="scenario-add-card" id="scenarioAddBtn" title="Añadir escenario">+</button>
      ${cardsHtml}
    `;

    document.getElementById('scenarioAddBtn').addEventListener('click', openScenarioModal);
    grid.querySelectorAll('.scenario-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        prefs.scenarios = (prefs.scenarios || []).filter(s => s !== id);
        savePrefs(currentUserId);
        renderScenarios();
      });
    });
  }

  function openScenarioModal() {
    const modal = document.getElementById('scenarioModal');
    const list = document.getElementById('scenarioOptionsList');
    const selected = prefs.scenarios || [];

    list.innerHTML = SCENARIO_OPTIONS.map(opt => `
      <button class="scenario-option-row${selected.includes(opt.id) ? ' selected' : ''}" data-id="${opt.id}">
        <span class="emoji">${opt.emoji}</span>
        <span class="scenario-option-label">${escapeHtml(opt.label)}</span>
        ${selected.includes(opt.id) ? '<span class="check">✓</span>' : ''}
      </button>
    `).join('');

    list.querySelectorAll('.scenario-option-row').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.dataset.id;
        const arr = prefs.scenarios || [];
        prefs.scenarios = arr.includes(id) ? arr.filter(s => s !== id) : [...arr, id];
        savePrefs(currentUserId);
        renderScenarios();
        openScenarioModal();
      });
    });

    modal.classList.add('open');
  }

  function setupScenarioPicker() {
    renderScenarios();
    document.getElementById('scenarioModalClose').addEventListener('click', () => {
      document.getElementById('scenarioModal').classList.remove('open');
    });
    document.getElementById('scenarioModal').addEventListener('click', (e) => {
      if (e.target.id === 'scenarioModal') e.currentTarget.classList.remove('open');
    });
  }

  // ---- Calendar (vacío por ahora — listo para mostrar citas en el futuro) ----
  // scheduledAppointments: { 'YYYY-MM-DD': true } — poblar cuando exista la data real
  const scheduledAppointments = {};

  function shiftMonth(delta) {
    calDate.setMonth(calDate.getMonth() + delta);
    renderCalendar();
  }

  function renderCalendar() {
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    const today = new Date();

    const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('calLabel').textContent = `${monthNames[month]} ${year}`;

    const dowLabels = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // lunes = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = dowLabels.map(d => `<div class="calendar-dow">${d}</div>`).join('');
    for (let i = 0; i < startOffset; i++) html += `<div class="calendar-day empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      html += `<div class="calendar-day${isToday ? ' today' : ''}">${d}</div>`;
    }

    document.getElementById('calGrid').innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadProfile();
</script>
</body>
