<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — NEX</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8; --ink: #1A1A18; --sage: #6B8C6E;
    --terracotta: #C4704F; --warm-white: #FDFAF5; --muted: #7A7870;
    --border: rgba(26,26,24,0.12); --sage-light: #f0f5f1;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--warm-white); color: var(--ink); overflow-x: hidden; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    background: rgba(253,250,245,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
  .nav-links a { font-size: 0.875rem; font-weight: 400; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { background: var(--ink); color: var(--warm-white) !important; padding: 0.5rem 1.25rem; border-radius: 100px; font-weight: 500 !important; text-transform: none !important; }

  footer { background: var(--ink); padding: 2.5rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  footer .logo { color: white; font-size: 1.2rem; }
  .footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }

  .page-wrap {
    padding: 9rem 3rem 6rem; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .profile-card {
    background: var(--sage-light); border-radius: 20px;
    padding: 3rem; width: 100%; max-width: 440px;
    box-shadow: 0 4px 24px rgba(26,26,24,0.07);
  }

  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--ink); color: var(--warm-white);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }

  .profile-eyebrow { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; text-align: center; }
  .profile-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; color: var(--ink); line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 2rem; text-align: center; }
  .profile-title em { font-style: italic; color: var(--sage); }

  .profile-box {
    background: white; border-radius: 14px; border: 1px solid var(--border);
    overflow: hidden;
  }
  .profile-row {
    padding: 1.25rem 1.75rem;
    border-bottom: 1px solid var(--border);
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row .label {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem;
  }
  .profile-row .value { font-size: 0.95rem; color: var(--ink); font-weight: 400; }

  .btn-secondary {
    background: none; color: var(--ink); border: 1.5px solid var(--border);
    border-radius: 100px; padding: 0.8rem 2rem;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: border-color 0.2s, background 0.2s;
    display: block; width: 100%; margin-top: 1.75rem;
  }
  .btn-secondary:hover { border-color: var(--ink); background: var(--cream); }

  .loading-text { text-align: center; color: var(--muted); font-size: 0.85rem; }

</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">NEX</a>
  <ul class="nav-links">
    <li><a href="about.html">Nosotros</a></li>
    <li><a href="contact.html">Contacto</a></li>
    <li><a href="faq.html">Preguntas frecuentes</a></li>
    <li id="navAuthSlot"><a href="login.html" class="nav-cta">Iniciar sesión</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="profile-card" id="profileCard">
    <p class="loading-text" id="loadingText">Cargando tu perfil…</p>
  </div>
</div>

<footer>
  <a href="index.html" class="logo">NEX</a>
  <p class="footer-copy">&copy; 2025 NEX. Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>
<script>
  const supabaseClient = getSupabaseClient();
  const card = document.getElementById('profileCard');

  async function loadProfile() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const user = session.user;

    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('name, phone, age, tipo_consulta')
      .eq('id', user.id)
      .single();

    const name = (profile && profile.name) ? profile.name : (user.email || 'Usuario');

    let rows = `
      <div class="profile-row">
        <p class="label">Nombre</p>
        <p class="value">${escapeHtml(name)}</p>
      </div>
      <div class="profile-row">
        <p class="label">Correo</p>
        <p class="value">${escapeHtml(user.email || '—')}</p>
      </div>
    `;

    if (profile && profile.phone) {
      rows += `
      <div class="profile-row">
        <p class="label">Teléfono</p>
        <p class="value">${escapeHtml(profile.phone)}</p>
      </div>`;
    }

    if (profile && profile.age) {
      rows += `
      <div class="profile-row">
        <p class="label">Edad</p>
        <p class="value">${escapeHtml(String(profile.age))}</p>
      </div>`;
    }

    card.innerHTML = `
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <p class="profile-eyebrow">Tu cuenta</p>
      <h2 class="profile-title">Hola, <em>${escapeHtml(name)}</em></h2>
      <div class="profile-box">${rows}</div>
      <button class="btn-secondary" id="logoutBtn">Cerrar sesión</button>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadProfile();
</script>
</body>
</html>
