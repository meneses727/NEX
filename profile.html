<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — NEX</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8; --ink: #1A1A18; --sage: #6B8C6E;
    --terracotta: #C4704F; --warm-white: #FDFAF5; --muted: #7A7870;
    --border: rgba(26,26,24,0.12); --sage-light: #f0f5f1;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--warm-white); color: var(--ink); overflow-x: hidden; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    background: rgba(253,250,245,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; align-items: center; }
  .nav-links a { font-size: 0.875rem; font-weight: 400; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { background: var(--ink); color: var(--warm-white) !important; padding: 0.5rem 1.25rem; border-radius: 100px; font-weight: 500 !important; text-transform: none !important; }

  footer { background: var(--ink); padding: 2.5rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  footer .logo { color: white; font-size: 1.2rem; }
  .footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }

  .page-wrap {
    padding: 9rem 3rem 6rem; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .profile-card {
    background: var(--sage-light); border-radius: 20px;
    padding: 3rem; width: 100%; max-width: 440px;
    box-shadow: 0 4px 24px rgba(26,26,24,0.07);
  }

  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--ink); color: var(--warm-white);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }

  .profile-eyebrow { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; text-align: center; }
  .profile-title { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 700; color: var(--ink); line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 2rem; text-align: center; }
  .profile-title em { font-style: italic; color: var(--sage); }

  .profile-box {
    background: white; border-radius: 14px; border: 1px solid var(--border);
    overflow: hidden;
  }
  .profile-row {
    padding: 1.25rem 1.75rem;
    border-bottom: 1px solid var(--border);
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row .label {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem;
  }
  .profile-row .value { font-size: 0.95rem; color: var(--ink); font-weight: 400; }

  .btn-secondary {
    background: none; color: var(--ink); border: 1.5px solid var(--border);
    border-radius: 100px; padding: 0.8rem 2rem;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: border-color 0.2s, background 0.2s;
    display: block; width: 100%; margin-top: 0.85rem;
    text-align: center; text-decoration: none;
  }
  .btn-secondary:hover { border-color: var(--ink); background: var(--cream); }

  .btn-primary-full {
    background: var(--ink); color: white; border: none;
    border-radius: 100px; padding: 0.85rem 2rem;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: background 0.2s;
    display: block; width: 100%; margin-top: 1.75rem;
    text-align: center; text-decoration: none;
  }
  .btn-primary-full:hover { background: #333; }

  .loading-text { text-align: center; color: var(--muted); font-size: 0.85rem; }

  /* ---- Profile card container adjustments ---- */
  .profile-card { padding: 0 0 3rem; overflow: visible; }
  .profile-card-inner { padding: 0 3rem; }

  /* ---- Banner ---- */
  .profile-banner {
    height: 120px; border-radius: 20px 20px 0 0;
    background: var(--banner-color, #AEE1F9);
    position: relative; transition: background 0.25s ease;
  }
  .banner-edit-badge {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
    border: none; border-radius: 100px; padding: 0.4rem 0.9rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.03em; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 0.3rem;
  }
  .banner-color-picker {
    position: absolute; top: 52px; right: 12px;
    display: none; gap: 0.5rem; background: white; padding: 0.6rem;
    border-radius: 100px; box-shadow: 0 6px 20px rgba(26,26,24,0.18); z-index: 5;
  }
  .banner-color-picker.active { display: flex; }
  .banner-color-dot {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .banner-color-dot.active { border-color: var(--ink); }

  /* ---- Avatar + name/email header row ---- */
  .profile-header-row {
    display: flex; align-items: center; gap: 1rem;
    margin: -42px 0 1.75rem; padding: 0 0.25rem;
  }
  .profile-avatar-wrap { position: relative; flex-shrink: 0; }
  .profile-avatar-img {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--sage-light); background: white; display: block;
    box-shadow: 0 3px 10px rgba(26,26,24,0.12);
  }
  .avatar-edit-badge {
    position: absolute; bottom: 0; right: 0; width: 26px; height: 26px;
    border-radius: 50%; background: var(--ink); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; border: 2px solid var(--sage-light);
  }
  .profile-header-text { min-width: 0; }
  .profile-header-name {
    font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700;
    color: var(--ink); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-header-email {
    font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profile-header-tag {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sage); margin-top: 0.3rem;
  }

  /* ---- Avatar picker modal ---- */
  .avatar-picker-overlay {
    position: fixed; inset: 0; background: rgba(26,26,24,0.45);
    display: none; align-items: center; justify-content: center; z-index: 300;
    padding: 1.5rem;
  }
  .avatar-picker-overlay.active { display: flex; }
  .avatar-picker-box {
    background: white; border-radius: 18px; padding: 2rem; max-width: 380px; width: 100%;
    text-align: center;
  }
  .avatar-picker-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.1rem; margin-bottom: 0.35rem; }
  .avatar-picker-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.25rem; }
  .avatar-options { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }
  .avatar-option-img {
    width: 66px; height: 66px; border-radius: 50%; object-fit: cover; cursor: pointer;
    border: 3px solid transparent; transition: border-color 0.15s;
  }
  .avatar-option-img.selected, .avatar-option-img:hover { border-color: var(--sage); }
  .avatar-picker-close {
    margin-top: 1.5rem; background: none; border: none; color: var(--muted);
    font-size: 0.8rem; cursor: pointer; text-decoration: underline;
  }

  /* ---- Scenario buttons (patients only) ---- */
  .scenario-section { margin-top: 1.75rem; }
  .section-eyebrow {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.7rem;
  }
  .scenario-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .scenario-btn {
    flex: 1 1 30%; min-width: 110px;
    background: white; border: 1px solid var(--border); border-radius: 14px;
    padding: 1rem 0.75rem; font-size: 0.82rem; font-weight: 500; color: var(--ink);
    font-family: 'DM Sans', sans-serif; cursor: default; text-align: center; line-height: 1.35;
  }

  /* ---- Calendar ---- */
  .calendar-section { margin-top: 1.75rem; }
  .calendar-box { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.4rem; }
  .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .calendar-month-label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 0.95rem; }
  .calendar-nav-btn {
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 1rem; padding: 0.2rem 0.5rem; border-radius: 6px;
  }
  .calendar-nav-btn:hover { background: var(--cream); color: var(--ink); }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .calendar-grid .day-name { color: var(--muted); font-weight: 600; font-size: 0.62rem; text-transform: uppercase; padding-bottom: 0.4rem; }
  .calendar-grid .day-cell { padding: 0.5rem 0; border-radius: 8px; font-size: 0.8rem; color: var(--ink); }
  .calendar-grid .day-cell.today { background: var(--sage-light); font-weight: 700; color: var(--sage); }
  .calendar-grid .day-cell.empty { visibility: hidden; }
  .calendar-footnote { font-size: 0.7rem; color: var(--muted); margin-top: 0.75rem; text-align: center; }

</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">NEX</a>
  <ul class="nav-links">
    <li><a href="about.html">Nosotros</a></li>
    <li><a href="contact.html">Contacto</a></li>
    <li><a href="faq.html">Preguntas frecuentes</a></li>
    <li id="navAuthSlot"><a href="login.html" class="nav-cta">Iniciar sesión</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="profile-card" id="profileCard">
    <p class="loading-text" id="loadingText">Cargando tu perfil…</p>
  </div>
</div>

<div class="avatar-picker-overlay" id="avatarPickerOverlay">
  <div class="avatar-picker-box">
    <p class="avatar-picker-title">Elige tu avatar</p>
    <p class="avatar-picker-sub">Selecciona la imagen que más te represente</p>
    <div class="avatar-options" id="avatarOptions"></div>
    <button class="avatar-picker-close" id="avatarPickerClose">Cancelar</button>
  </div>
</div>

<footer>
  <a href="index.html" class="logo">NEX</a>
  <p class="footer-copy">&copy; 2025 NEX. Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>
<script>
  const supabaseClient = getSupabaseClient();
  const card = document.getElementById('profileCard');

  // ---- Opciones disponibles ----
  const BANNER_COLORS = {
    azul:      '#AEE1F9',
    verde:     '#C6E8C9',
    naranja:   '#F7C08A',
    rojo:      '#F3B6B0',
    rosa:      '#F6C9DE',
    morado:    '#D8C6F0',
    amarillo:  '#F5E6A8'
  };
  const AVATAR_OPTIONS = [
    'assets/avatars/avatar-1.png',
    'assets/avatars/avatar-2.png',
    'assets/avatars/avatar-3.png',
    'assets/avatars/avatar-4.png'
  ];

  let currentProfile = null;
  let currentUserId = null;
  let selectedBannerKey = 'azul';
  let selectedAvatar = AVATAR_OPTIONS[0];

  async function loadProfile() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const user = session.user;
    currentUserId = user.id;

    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('name, phone, age, tipo_consulta, role, track, banner_color, avatar_choice')
      .eq('id', user.id)
      .single();

    currentProfile = profile;

    const name = (profile && profile.name) ? profile.name : (user.email || 'Usuario');
    const isTherapist = profile && profile.role === 'therapist';

    // Valores guardados (o default) para banner y avatar
    selectedBannerKey = (profile && profile.banner_color && BANNER_COLORS[profile.banner_color])
      ? profile.banner_color : 'azul';
    selectedAvatar = (profile && profile.avatar_choice && AVATAR_OPTIONS[profile.avatar_choice - 1])
      ? AVATAR_OPTIONS[profile.avatar_choice - 1] : AVATAR_OPTIONS[0];

    let rows = `
      <div class="profile-row">
        <p class="label">Nombre</p>
        <p class="value">${escapeHtml(name)}</p>
      </div>
      <div class="profile-row">
        <p class="label">Correo</p>
        <p class="value">${escapeHtml(user.email || '—')}</p>
      </div>
    `;

    if (profile && profile.phone) {
      rows += `
      <div class="profile-row">
        <p class="label">Teléfono</p>
        <p class="value">${escapeHtml(profile.phone)}</p>
      </div>`;
    }

    if (profile && profile.age) {
      rows += `
      <div class="profile-row">
        <p class="label">Edad</p>
        <p class="value">${escapeHtml(String(profile.age))}</p>
      </div>`;
    }

    if (!isTherapist && profile && profile.track) {
      rows += `
      <div class="profile-row">
        <p class="label">Track asignado</p>
        <p class="value">Track ${escapeHtml(profile.track)}</p>
      </div>`;
    }

    const assignButton = isTherapist
      ? `<a href="assign-track.html" class="btn-primary-full">Asignar tratamiento</a>`
      : '';

    // Sección de botones de escenario: solo para pacientes
    const scenarioSection = !isTherapist ? `
      <div class="scenario-section">
        <p class="section-eyebrow">Tus botones de escenario</p>
        <div class="scenario-buttons">
          <button class="scenario-btn" type="button">En la mañana antes de trabajar</button>
          <button class="scenario-btn" type="button">Bus mañana</button>
          <button class="scenario-btn" type="button">Simplemente meditación</button>
        </div>
      </div>` : '';

    // Sección de calendario: para paciente y terapeuta
    const calendarSection = `
      <div class="calendar-section">
        <p class="section-eyebrow">${isTherapist ? 'Calendario' : 'Tu próxima cita'}</p>
        <div class="calendar-box">
          <div class="calendar-header">
            <button class="calendar-nav-btn" id="calPrev" type="button">&#8592;</button>
            <p class="calendar-month-label" id="calMonthLabel"></p>
            <button class="calendar-nav-btn" id="calNext" type="button">&#8594;</button>
          </div>
          <div class="calendar-grid" id="calGrid"></div>
          <p class="calendar-footnote">Aún no tienes citas programadas</p>
        </div>
      </div>`;

    card.innerHTML = `
      <div class="profile-banner" id="profileBanner" style="--banner-color: ${BANNER_COLORS[selectedBannerKey]}">
        <button class="banner-edit-badge" id="bannerEditBtn" type="button">Cambiar color</button>
        <div class="banner-color-picker" id="bannerColorPicker">
          ${Object.entries(BANNER_COLORS).map(([key, hex]) => `
            <button class="banner-color-dot ${key === selectedBannerKey ? 'active' : ''}"
              data-key="${key}" style="background:${hex}" title="${key}" type="button"></button>
          `).join('')}
        </div>
      </div>
      <div class="profile-card-inner">
        <div class="profile-header-row">
          <div class="profile-avatar-wrap">
            <img class="profile-avatar-img" id="profileAvatarImg" src="${selectedAvatar}" alt="Avatar de ${escapeHtml(name)}">
            <button class="avatar-edit-badge" id="avatarEditBtn" type="button" title="Cambiar avatar">&#9998;</button>
          </div>
          <div class="profile-header-text">
            <p class="profile-header-tag">${isTherapist ? 'Cuenta de terapeuta' : 'Tu cuenta'}</p>
            <p class="profile-header-name">${escapeHtml(name)}</p>
            <p class="profile-header-email">${escapeHtml(user.email || '—')}</p>
          </div>
        </div>
        <div class="profile-box">${rows}</div>
        ${assignButton}
        ${scenarioSection}
        ${calendarSection}
        <button class="btn-secondary" id="logoutBtn">Cerrar sesión</button>
      </div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    setupBannerPicker();
    setupAvatarPicker();
    setupCalendar();
  }

  // ---- Banner: mostrar/ocultar selector y guardar color ----
  function setupBannerPicker() {
    const editBtn = document.getElementById('bannerEditBtn');
    const picker = document.getElementById('bannerColorPicker');
    const banner = document.getElementById('profileBanner');

    editBtn.addEventListener('click', () => picker.classList.toggle('active'));

    picker.querySelectorAll('.banner-color-dot').forEach(dot => {
      dot.addEventListener('click', async () => {
        const key = dot.getAttribute('data-key');
        selectedBannerKey = key;
        banner.style.setProperty('--banner-color', BANNER_COLORS[key]);
        picker.querySelectorAll('.banner-color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        picker.classList.remove('active');
        await saveProfileField({ banner_color: key });
      });
    });

    document.addEventListener('click', (e) => {
      if (!editBtn.contains(e.target) && !picker.contains(e.target)) {
        picker.classList.remove('active');
      }
    });
  }

  // ---- Avatar: abrir modal, elegir imagen y guardar ----
  function setupAvatarPicker() {
    const overlay = document.getElementById('avatarPickerOverlay');
    const optionsWrap = document.getElementById('avatarOptions');
    const editBtn = document.getElementById('avatarEditBtn');
    const closeBtn = document.getElementById('avatarPickerClose');
    const avatarImg = document.getElementById('profileAvatarImg');

    optionsWrap.innerHTML = AVATAR_OPTIONS.map((src, i) => `
      <img src="${src}" class="avatar-option-img ${src === selectedAvatar ? 'selected' : ''}"
        data-index="${i + 1}" data-src="${src}" alt="Opción de avatar ${i + 1}">
    `).join('');

    editBtn.addEventListener('click', () => overlay.classList.add('active'));
    closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });

    optionsWrap.querySelectorAll('.avatar-option-img').forEach(img => {
      img.addEventListener('click', async () => {
        selectedAvatar = img.getAttribute('data-src');
        avatarImg.src = selectedAvatar;
        optionsWrap.querySelectorAll('.avatar-option-img').forEach(i => i.classList.remove('selected'));
        img.classList.add('selected');
        overlay.classList.remove('active');
        await saveProfileField({ avatar_choice: parseInt(img.getAttribute('data-index'), 10) });
      });
    });
  }

  // ---- Guardar cambios en Supabase ----
  async function saveProfileField(fields) {
    if (!currentUserId) return;
    const { error } = await supabaseClient
      .from('profiles')
      .update(fields)
      .eq('id', currentUserId);
    if (error) console.error('Error guardando perfil:', error);
  }

  // ---- Calendario vacío (sin citas por ahora) ----
  let calViewDate = new Date();

  function setupCalendar() {
    document.getElementById('calPrev').addEventListener('click', () => {
      calViewDate.setMonth(calViewDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', () => {
      calViewDate.setMonth(calViewDate.getMonth() + 1);
      renderCalendar();
    });
    renderCalendar();
  }

  function renderCalendar() {
    const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const dayNames = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();

    document.getElementById('calMonthLabel').textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);
    // Lunes = 0 ... Domingo = 6
    let startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    let cells = dayNames.map(d => `<div class="day-name">${d}</div>`).join('');

    for (let i = 0; i < startOffset; i++) {
      cells += `<div class="day-cell empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      cells += `<div class="day-cell ${isToday ? 'today' : ''}">${d}</div>`;
    }

    document.getElementById('calGrid').innerHTML = cells;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadProfile();
</script>
</body>
</html>
